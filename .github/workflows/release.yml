name: Build and Release

# Builds the userspace AmneziaWG packages (amneziawg-go + awg) for every
# supported router architecture and publishes them as a GitHub Release.
#
#   * Push a tag like  v1.1.7   -> builds and creates/updates that release
#   * "Run workflow" (manual)   -> builds and uploads the .ipk as run artifacts
#
# No kernel module is built: this is a pure userspace package. The awg CLI is
# linked statically against musl so it runs on the router's older glibc.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # amneziawg-tools (awg) release tag — the static-musl awg CLI is built from this tag.
  # AmneziaWG 3.0 support used to live ONLY on the unmerged feat/awg3 branch, so 1.5.0-1.5.6 had
  # to pin it by SHA (05434cab…) and 1.5.7 retreated to the last 2.0 release tag. Both are
  # history now: the v3 work was merged to master and RELEASED as v3.0.20260730, and upstream's
  # own amneziawg-go Dockerfile pins that exact tag next to the v3 daemon — so the pair built
  # here is the upstream-sanctioned one. NB the merged code is NOT the old branch commit
  # (05434cab is not even an ancestor of master): config.c, ipc-linux.h, ipc-uapi.h, show.c and
  # showconf.c were reworked and type.c/type.h added. Consequences for us, both verified:
  #   * the 7 AWG-3.0 config keys keep their names, so generate_config is unchanged;
  #   * `awg show <if> dump` gains 7 columns on the INTERFACE line (before fwmark) and prints
  #     ranges where it used to print scalars. Every addon consumer skips that line (`tail -n +2`,
  #     `awk NR==2`), so no parser breaks — do not "simplify" those skips away.
  AWG_TOOLS_TAG: v3.0.20260730
  # amneziawg-go (daemon) — built from OUR FORK, not upstream, until upstream merges the
  # patches the router build needs (all carried as real commits on the fork branch below):
  #   1. bounded buffer pool (PreallocatedBuffersPerPool, router default 1024) — the fix for
  #      daemon OOM under load on low-RAM boxes (was a CI sed here; now a fork commit),
  #   2. sendmmsg/recvmmsg -> sendmsg/recvmsg ENOSYS fallback — without it the daemon can't send
  #      a single packet on Linux < 3.0 (RT-AC68U / 2.6.36), so the tunnel never passes traffic,
  #   3. runtime pool-size control (upstream PR #152): the daemon reads
  #      WG_PREALLOCATED_BUFFERS_PER_POOL at start (0 = unbounded). The addon launcher does NOT
  #      set it: 1.3.13 un-capped high-RAM boxes and a 2GB RT-BE88U OOM-crash-looped within
  #      minutes (a slow UDP-TX leg + line-rate RX balloons the heap — the cap is FLOW CONTROL,
  #      not just low-RAM armor; reverted 1.3.14). The env stays honored for manual experiments;
  #      the compiled default stays the router-safe 1024.
  #   4. S4 keepalive classification (upstream PR #161) — an AmneziaWG 3.0 regression against
  #      1.5/2.0 configs: with S4 > 0 every keepalive counted as data and re-handshaked an idle
  #      tunnel every ~15 s. See the assert (and the measurements) in the build step below.
  # The branch is based on the v3.0.x tag (AWG_GO_TAG) — AmneziaWG 3.0, keeping the 1.5/2.0
  # params (I1-I5, S3/S4) and adding the 3.0 ones. Reproducible, not floating master.
  #
  # BACK ON AmneziaWG 3.0 as of 1.5.9 (1.5.7 had parked the daemon on 2.0 out of caution, with no
  # field bug behind it). What actually changed since: the v3 `awg` CLI stopped being an unmerged
  # branch (see AWG_TOOLS_TAG above) and upstream cut v3.0.2/v3.0.3. Those two daemon releases are
  # functionally identical to v3.0.1 — the whole diff is Dockerfile + README + one error string in
  # device/uapi.go — so the daemon shipped here behaves exactly like the 1.5.6 one.
  AWG_GO_TAG: v3.0.3
  AWG_GO_REPO: https://github.com/william-aqn/amneziawg-go.git
  AWG_GO_REF: router-build-v3
  # armv7-2.6 (kernel 2.6.3x — RT-AC68U / RT-AC66U_B1 class) is pinned SEPARATELY since 1.5.9.
  # Go >= 1.24 supports only Linux >= 3.2, so that package is built by its own step with a pinned
  # Go 1.23 toolchain plus dependency downgrades and an Outline SDK drop. Giving it its own
  # repo/ref/tag means:
  #   (a) the modern arches build with the stable toolchain and carry NONE of that machinery —
  #       a future daemon version does not have to stay buildable under Go 1.23 for them to move;
  #   (b) if a future version ever stops building there, this pin simply stays put instead of
  #       failing the whole release.
  # Both tracks point at the same branch today: AmneziaWG 3.0 was verified on a real 2.6.36 kernel
  # (RT-AC66U_B1, ARMv7 with no VFP — full 3.0 handshake with header protection, no sendmmsg
  # ENOSYS), so there is no reason to keep that package a protocol version behind.
  AWG_GO_TAG_LEGACY: v3.0.3
  AWG_GO_REPO_LEGACY: https://github.com/william-aqn/amneziawg-go.git
  AWG_GO_REF_LEGACY: router-build-v3

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (ARM emulation for the static-musl awg build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build amneziawg-go (aarch64 + ARM32)
        run: |
          set -eux
          git clone --depth 1 --branch "$AWG_GO_REF" "$AWG_GO_REPO" amneziawg-go
          AWG_GO_COMMIT=$(git -C amneziawg-go rev-parse --short HEAD)
          echo "amneziawg-go: $AWG_GO_REPO ref $AWG_GO_REF (based on $AWG_GO_TAG) commit: $AWG_GO_COMMIT"
          # `Version` is a `const` in version.go, so `-ldflags -X main.Version=` can't override it
          # (only vars). Patch the source so `amneziawg-go --version` reports the real ref instead
          # of the stale hardcoded "0.0.20250522" (which has fooled diagnosis before). The
          # -poolcfg-smfix suffix marks the fork patches (bounded pool, default 1024, runtime
          # WG_PREALLOCATED_BUFFERS_PER_POOL override + sendmmsg fallback) — a field diag shows at
          # a glance whether the running daemon carries them, in particular whether it honors the
          # pool env the addon launcher sets on high-RAM boxes (pre-1.3.13 daemons say -pool1024
          # here and ignore that env).
          # The `-awg3-` marker is LOAD-BEARING, not cosmetic: awg3_supported() in
          # addon/amneziawg.sh gates the AmneziaWG 3.0 params on that exact substring. Stamping it
          # onto a 2.0 daemon would open the gate, the addon would emit 3.0 keys, `awg setconf`
          # would reject them and abort the WHOLE file, and the tunnel would not come up at all.
          # So the marker moves in the SAME commit as AWG_GO_TAG/AWG_GO_REF — never on its own,
          # in either direction.
          sed -i "s|^const Version = .*|const Version = \"$AWG_GO_TAG-awg3-poolcfg-smfix ($AWG_GO_COMMIT)\"|" amneziawg-go/version.go
          grep '^const Version' amneziawg-go/version.go || true
          # The functional patches now ride in as COMMITS on the fork branch (see the env
          # block) rather than seds — but still HARD-assert each is present, so a bad rebase or a
          # wrong AWG_GO_REF fails the build instead of silently shipping a broken daemon:
          #   1. BOUNDED BUFFER POOL, default 1024 (upstream's iOS/Windows profile) — the fix for
          #      "daemon OOM under heavy load" on low-RAM routers. Upstream's Linux profile leaves
          #      it 0 (unbounded): under sustained inbound the receive routine allocates 64KB
          #      buffers faster than software ChaCha20 drains them and the runtime aborts with
          #      `runtime: out of memory`. 1024 caps the pool at 64MB and turns WaitPool.Get into
          #      real backpressure (excess UDP dropped by the kernel). NB the 64KB MaxSegmentSize
          #      is deliberately NOT shrunk — the cap is size-agnostic and UDP-GRO kernels (>=4.18)
          #      can coalesce up to 64KB. Since 1.3.13 the bound is a VAR overridable at start via
          #      WG_PREALLOCATED_BUFFERS_PER_POOL (0 = unbounded — for MANUAL experiments only:
          #      the launcher never sets it since 1.3.14, un-capping field-OOMed a 2GB box — the
          #      cap is flow control; the compiled default must STAY 1024 so every launch keeps
          #      it). Assert BOTH the router-safe default and the env hook, so neither can
          #      silently vanish:
          grep -q 'var PreallocatedBuffersPerPool uint32 = 1024' amneziawg-go/device/queueconstants_default.go
          grep -q 'WG_PREALLOCATED_BUFFERS_PER_POOL' amneziawg-go/main.go
          #   2. SENDMMSG/RECVMMSG -> per-packet ENOSYS FALLBACK — StdNetBind uses WriteBatch/
          #      ReadBatch (sendmmsg/recvmmsg, added in Linux 3.0). On the RT-AC68U's 2.6.36 they
          #      return ENOSYS, so WITHOUT this the daemon forms handshakes but can't send/recv a
          #      single packet (tunnel up, no traffic, forever). The fork adds a sticky
          #      batchUnsupported flag that falls back to WriteMsgUDP/ReadMsgUDP. Proven on a real
          #      RT-AC68U: handshake completes, traffic flows both ways.
          grep -q 'batchUnsupported' amneziawg-go/conn/bind_std.go
          #   4. S4 KEEPALIVE CLASSIFICATION — an AWG 3.0 regression against 1.5/2.0 configs.
          #      v3 moved the S4 transport padding into RoutineEncryption (it seals from
          #      elem.buffer[:elem.padding+MessageTransportHeaderSize]), so a keepalive measures
          #      elem.padding+MessageKeepaliveSize; RoutineSequentialSender still compared it to
          #      the bare constant. With S4 > 0 EVERY keepalive counted as data, armed
          #      newHandshake (~15 s) and re-handshaked an idle tunnel forever. Measured, idle,
          #      PersistentKeepalive=5s, 75 s window: v0.2.19 = 1 handshake at any S4; v3.0.1 =
          #      1 at S4=0 but 5 at S4=30; with the fix, 1 again. Also reproduced with a v3
          #      client against an unmodified v0.2.19 peer — it breaks EXISTING provider configs
          #      on upgrade, since S4 is a plain AWG 2.0 param the addon has always passed through.
          grep -q 'int(elem.padding)+MessageKeepaliveSize' amneziawg-go/device/send.go
          mkdir -p "$GITHUB_WORKSPACE/output"
          cd amneziawg-go
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64       go build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/output/amneziawg-go"
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/output/amneziawg-go-arm"
          # NOTE: the GOARM=5 daemon for the armv7-2.6 package is built by the SEPARATE legacy
          # step below with a pinned Go 1.23 toolchain — Go >= 1.24 does not support the
          # 2.6.3x kernels those routers run (RT-AC68U class).

      - name: Build amneziawg-go-arm5 (legacy Go 1.23 for 2.6.3x kernels — RT-AC68U class)
        run: |
          set -eux
          # Go >= 1.24 supports only Linux >= 3.2; on the RT-AC68U's 2.6.36 the runtime is
          # officially unsupported and was seen dying silently right after the wireguard-go
          # banner ("failed to create interface", daemon exit with no message). Go 1.23
          # supports Linux >= 2.6.32, so the armv7-2.6 package ships a Go 1.23 build.
          # amneziawg-go demands a newer go only through dependency pins — the code compiles
          # clean on 1.23 against the newest 1.23-compatible x/* line (x/sys v0.35, x/net v0.43,
          # x/crypto v0.41). Verified on a real 2.6.32 kernel (qemu-system-arm versatilepb,
          # Debian Squeeze armel): TUN creation + obfuscated setconf + UAPI all pass; and AWG 3.0
          # specifically on a real 2.6.36 (RT-AC66U_B1): full handshake with header protection.
          #
          # This step OWNS its pins and its own clone (since 1.5.9). It used to `cp -r` the tree
          # the modern step had already cloned, which silently made every arch share one daemon
          # version — so a future upstream release would have had to stay buildable under Go 1.23
          # or the whole release would fail. Now the downgrade machinery below (Outline drop,
          # dependency downgrades, GOTOOLCHAIN pin) exists ONLY here: the modern arches build with
          # the stable toolchain and touch none of it, and if a future version ever stops building
          # here, AWG_GO_REF_LEGACY simply stays put while AWG_GO_REF moves on.
          git clone --depth 1 --branch "$AWG_GO_REF_LEGACY" "$AWG_GO_REPO_LEGACY" amneziawg-go-legacy
          cd amneziawg-go-legacy
          AWG_GO_COMMIT=$(git rev-parse --short HEAD)
          echo "amneziawg-go (legacy): $AWG_GO_REPO_LEGACY ref $AWG_GO_REF_LEGACY (based on $AWG_GO_TAG_LEGACY) commit: $AWG_GO_COMMIT"
          # Carries the -awg3- marker like every other arch (see the marker note in the modern
          # step): AmneziaWG 3.0 is verified working on these kernels, so there is no reason to
          # hold the capability gate closed here.
          sed -i "s|^const Version = .*|const Version = \"$AWG_GO_TAG_LEGACY-awg3-legacy26-poolcfg-smfix ($AWG_GO_COMMIT)\"|" version.go
          grep '^const Version' version.go
          # Same hard asserts as the modern step — this clone is independent, so it needs its own.
          # The 2.6.x fleet (RT-AC68U, 256MB!) needs the pool cap even more than 512MB boxes
          # (all far below 768MiB, so the launcher never un-caps the pool there), and
          # — critically — this legacy build is the ONLY one that runs on the 2.6.36 kernels where
          # the sendmmsg fallback is load-bearing: without it this daemon can't pass a single byte.
          grep -q 'var PreallocatedBuffersPerPool uint32 = 1024' device/queueconstants_default.go
          grep -q 'WG_PREALLOCATED_BUFFERS_PER_POOL' main.go
          grep -q 'batchUnsupported' conn/bind_std.go
          grep -q 'int(elem.padding)+MessageKeepaliveSize' device/send.go
          # AWG 3.0 moved the Outline SDK to golang.getoutline.org/sdk, which declares `go >= 1.25`
          # and is a DIRECT require — Go 1.23 refuses to load the module graph at all, before
          # compiling anything, even though the daemon never links it (only ./outline/*.go import
          # it). Dropping the directory removes every importer, so the requires can go too.
          rm -rf outline
          go mod edit -droprequire=golang.getoutline.org/sdk -droprequire=golang.getoutline.org/sdk/x
          # NB the go get below deliberately runs on the runner's DEFAULT (modern) toolchain: it
          # must read the current graph (x/crypto v0.42 etc, all go>=1.24) before it can
          # downgrade it. Only the final `go build` is pinned to go1.23.12.
          go get golang.org/x/sys@v0.35.0 golang.org/x/net@v0.43.0 golang.org/x/crypto@v0.41.0
          go mod edit -go=1.23.0 -toolchain=none
          # The surgery must be PROVEN, not assumed: a silently-surviving outline require or a
          # go directive the edit didn't take would fail later as an unreadable module-graph error.
          grep -q '^go 1.23.0' go.mod
          if grep -q 'golang.getoutline.org/sdk' go.mod; then
            echo "ERROR: the Outline SDK require survived the droprequire — Go 1.23 cannot load this graph"; exit 1
          fi
          GOTOOLCHAIN=go1.23.12 CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=5 \
            go build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/output/amneziawg-go-arm5"
          # Prove the legacy toolchain + pins actually made it into the shipped binary.
          go version -m "$GITHUB_WORKSPACE/output/amneziawg-go-arm5" | grep -E 'go1\.23|golang.org/x/sys'

      - name: Build awg (aarch64, static musl in emulated Alpine)
        run: |
          set -eux
          mkdir -p "$GITHUB_WORKSPACE/output"
          # init+fetch rather than `clone --branch`: AWG_TOOLS_TAG has been a raw SHA before
          # (1.5.0-1.5.6 pinned the unmerged feat/awg3 branch that way, and `clone --branch <sha>`
          # does NOT work). It is a real tag again today, which this shape also handles — so the
          # pin can move back to a SHA without touching the three build steps.
          docker run --rm --platform linux/arm64 -v "$GITHUB_WORKSPACE/output:/out" alpine:3.19 sh -c "apk add --no-cache build-base linux-headers git && git init /t && git -C /t remote add origin https://github.com/amnezia-vpn/amneziawg-tools.git && git -C /t fetch --depth 1 origin $AWG_TOOLS_TAG && git -C /t checkout FETCH_HEAD && cd /t/src && make LDFLAGS=-static PLATFORM_CFLAGS= && { cp awg /out/awg 2>/dev/null || cp wg /out/awg; } && chmod +x /out/awg"
          file "$GITHUB_WORKSPACE/output/awg"

      - name: Build awg-arm (ARM32, static musl in emulated Alpine)
        run: |
          set -eux
          mkdir -p "$GITHUB_WORKSPACE/output"
          docker run --rm --platform linux/arm/v7 -v "$GITHUB_WORKSPACE/output:/out" alpine:3.19 sh -c "apk add --no-cache build-base linux-headers git && git init /t && git -C /t remote add origin https://github.com/amnezia-vpn/amneziawg-tools.git && git -C /t fetch --depth 1 origin $AWG_TOOLS_TAG && git -C /t checkout FETCH_HEAD && cd /t/src && make LDFLAGS=-static PLATFORM_CFLAGS= && { cp awg /out/awg-arm 2>/dev/null || cp wg /out/awg-arm; } && chmod +x /out/awg-arm"
          file "$GITHUB_WORKSPACE/output/awg-arm"

      - name: Build awg-arm5 (old ARM, static musl, SOFT-FLOAT for VFP-less Cortex-A9)
        run: |
          set -eux
          mkdir -p "$GITHUB_WORKSPACE/output"
          # RT-AC68U (BCM4708 Cortex-A9) exposes NO hardware float — /proc/cpuinfo Features
          # is "swp half thumb fastmult edsp" (no vfp/neon). Any HARD-FLOAT (VFP) binary
          # SIGILLs on its first float op, which is why even the Alpine armhf (ARMv6 + VFP)
          # build failed. awg must be SOFT-FLOAT, exactly like the GOARM=5 daemon that works.
          # Alpine has no soft-float port, so build with dockcross linux-armv5-musl:
          # gcc + musl + ARMv5 (no VFP) + soft-float ABI, statically linked.
          docker run --rm -e AWG_TOOLS_TAG -v "$GITHUB_WORKSPACE/output:/out" dockcross/linux-armv5-musl bash -c '
            set -eux
            if [ -z "${CC:-}" ]; then CC=$(command -v arm-unknown-linux-musleabi-gcc arm-linux-musleabi-gcc 2>/dev/null | head -1); fi
            [ -z "${CC:-}" ] && CC=$(ls /usr/xcc/*/bin/*linux-musleabi-gcc 2>/dev/null | head -1)
            : "${CC:?no soft-float musl cross gcc found in image}"
            "$CC" --version | head -1
            command -v git >/dev/null 2>&1 || { apt-get update && apt-get install -y --no-install-recommends git ca-certificates; }
            git init /tmp/awgtools
            git -C /tmp/awgtools remote add origin https://github.com/amnezia-vpn/amneziawg-tools.git
            git -C /tmp/awgtools fetch --depth 1 origin "$AWG_TOOLS_TAG"
            git -C /tmp/awgtools checkout FETCH_HEAD
            make -C /tmp/awgtools/src CC="$CC" LDFLAGS=-static PLATFORM_CFLAGS=
            cp /tmp/awgtools/src/awg /out/awg-arm5 2>/dev/null || cp /tmp/awgtools/src/wg /out/awg-arm5
            chmod +x /out/awg-arm5
          '
          file "$GITHUB_WORKSPACE/output/awg-arm5"
          # Guard: never ship a hard-float awg again. The hard-float ABI emits the
          # Tag_ABI_VFP_args build attribute; a soft-float build does not.
          if readelf -A "$GITHUB_WORKSPACE/output/awg-arm5" | grep -q 'Tag_ABI_VFP_args'; then
            echo "ERROR: awg-arm5 is hard-float (VFP) — would SIGILL on VFP-less routers like RT-AC68U"; exit 1
          fi
          echo "awg-arm5 is soft-float — OK"

      - name: Build .ipk packages
        run: |
          set -eux
          # build-ipk.sh calls gtar (GNU tar); Ubuntu's tar is GNU tar
          sudo ln -sf "$(command -v tar)" /usr/local/bin/gtar
          ./build-ipk.sh
          ls -lh output/*.ipk

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amneziawg-ipk
          path: output/*.ipk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          VERSION="${GITHUB_REF_NAME#v}"
          # Release notes = this version's CHANGELOG.md section (the Russian feature
          # description). Fall back to auto-generated notes if no section is found.
          awk -v v="$VERSION" 'index($0,"### "v" ")==1{f=1;print;next} /^### /&&f{exit} f{print}' CHANGELOG.md > /tmp/relnotes.md
          if [ -s /tmp/relnotes.md ]; then
            NOTES="--notes-file /tmp/relnotes.md"
          else
            NOTES="--generate-notes"
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Drop any stale assets first (e.g. a prior build whose package version differed),
            # so --clobber (which only overwrites same-named files) can't leave them behind.
            for a in $(gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name'); do
              case "$a" in *.ipk) gh release delete-asset "$GITHUB_REF_NAME" "$a" -y || true ;; esac
            done
            gh release upload "$GITHUB_REF_NAME" output/*.ipk --clobber
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" $NOTES
          else
            gh release create "$GITHUB_REF_NAME" output/*.ipk --title "$GITHUB_REF_NAME" $NOTES
          fi

      # Register the new tag with jsDelivr so its data API resolves it immediately. The
      # router reads the latest version from jsDelivr when api.github.com is blocked;
      # without this, jsDelivr's tag crawl lags the release by minutes/hours.
      - name: Register tag with jsDelivr
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eux
          VERSION="${GITHUB_REF_NAME#v}"
          curl -sf "https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${VERSION}/build-ipk.sh" >/dev/null || true
